name: Build and Deploy MITS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Prepare cPanel deployment
        run: |
          rm -rf deploy
          mkdir deploy

          cp -R dist/. deploy/

          cat > deploy/.cpanel.yml <<'EOF'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=/home/mits/public_html/
              - find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.cpanel.yml' -exec cp -R {} "$DEPLOYPATH" \;
          EOF

      - name: Configure SSH
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy

          ssh-keyscan -p 22133 mits.edu >> ~/.ssh/known_hosts

      - name: Push deployment to cPanel
        working-directory: deploy
        run: |
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git branch -M master

          git add .
          git commit -m "Deploy ${GITHUB_SHA}"

          git remote add cpanel \
            "ssh://mits@mits.edu:22133/home/mits/mits-website-deploy"

          GIT_SSH_COMMAND="ssh -i ~/.ssh/cpanel_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            git push --force cpanel master