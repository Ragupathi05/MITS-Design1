name: Build and Deploy MITS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir deploy
          cp -R dist/. deploy/

          cat > deploy/.cpanel.yml <<'EOF'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=/home/mits/public_html/
              - /bin/cp -R index.html "$DEPLOYPATH"
              - /bin/cp -R assets "$DEPLOYPATH"
              - /bin/cp -R admissions "$DEPLOYPATH"
              - /bin/cp -R careers "$DEPLOYPATH"
              - /bin/cp -R departments "$DEPLOYPATH"
              - /bin/cp -R "Hero-Section" "$DEPLOYPATH"
              - /bin/cp -R infrastructure "$DEPLOYPATH"
              - /bin/cp -R "Intranational Relations" "$DEPLOYPATH"
              - /bin/cp -R library "$DEPLOYPATH"
              - /bin/cp -R Logos "$DEPLOYPATH"
              - /bin/cp -R "news-events" "$DEPLOYPATH"
              - /bin/cp -R "placement-pictures" "$DEPLOYPATH"
              - /bin/cp -R recruiters "$DEPLOYPATH"
              - /bin/cp -R Research "$DEPLOYPATH"
              - /bin/cp -R librery "$DEPLOYPATH"
              - /bin/cp -R "MITS Official Logo.png" "$DEPLOYPATH"
              - /bin/cp -R "MITS name.jpg" "$DEPLOYPATH"
              - /bin/cp -R estd.png "$DEPLOYPATH"
              - /bin/cp -R "mits-logo.jfif" "$DEPLOYPATH"
              - /bin/cp -R "mits-logo.png" "$DEPLOYPATH"
              - /bin/cp -R robots.txt "$DEPLOYPATH"
              - /bin/cp -R site.webmanifest "$DEPLOYPATH"
              - /bin/cp -R sitemap.xml "$DEPLOYPATH"
              - /bin/cp -R stats.html "$DEPLOYPATH"
          EOF

      - name: Configure SSH
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy

          ssh-keyscan -p 22133 mits.edu >> ~/.ssh/known_hosts

      - name: Push deployment to cPanel
        working-directory: deploy
        run: |
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git branch -M master
          git add .
          git commit -m "Deploy ${GITHUB_SHA}"

          git remote add cpanel \
            "ssh://mits@mits.edu:22133/home/mits/mits-website-deploy"

          GIT_SSH_COMMAND="ssh \
            -i ~/.ssh/cpanel_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20" \
            git push --force cpanel master